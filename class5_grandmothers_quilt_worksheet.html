<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 5 Maths Worksheet – Grandmother's Quilt</title>
<style>
:root{--ink:#203047;--blue:#2457a7;--pale:#eef5ff;--line:#d8e1ee;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrapper{max-width:900px;margin:24px auto;padding:16px}
.sheet{background:#fff;border-radius:16px;box-shadow:0 8px 28px #1d355710;padding:clamp(18px,4vw,36px)}
header{text-align:center;border-bottom:3px solid var(--blue);padding-bottom:18px;margin-bottom:22px}
h1{margin:0;color:var(--blue);font-size:clamp(24px,4vw,34px)}
.subtitle{font-weight:700;margin:5px 0;color:#52647b}
.topic{display:inline-block;background:var(--pale);color:var(--blue);padding:5px 12px;border-radius:20px;font-size:14px}
.details{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:20px 0}
.details label{font-size:14px;font-weight:bold}
.details input{width:100%;border:0;border-bottom:1.5px solid #8292a8;padding:8px 2px;font-size:16px;outline:none}
.instructions{background:#f7f9fc;border-left:4px solid var(--blue);padding:12px 16px;border-radius:7px;margin:18px 0}
.question{padding:17px 16px;margin:14px 0;border:1px solid var(--line);border-radius:11px;break-inside:avoid}
.question h3{font-size:16px;margin:0 0 12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.option{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer}
.option:hover{background:#f7faff}
.option input{margin-top:4px;accent-color:var(--blue)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e8edf5;color:var(--ink)}
#result{display:none;padding:18px;border-radius:12px;background:#eef8f2;border:1px solid #b9e2c9;margin:20px 0}
#result h2{margin:0 0 6px;color:var(--green)}
.review{margin-top:18px}
.review-item{padding:12px;border-radius:8px;margin:9px 0;background:#f7f9fc;border-left:4px solid var(--line)}
.correct{border-left-color:var(--green)}.incorrect{border-left-color:var(--red)}
.small{font-size:13px;color:#607086}
footer{text-align:center;color:#718096;font-size:12px;margin-top:25px}
@media(max-width:600px){.details{grid-template-columns:1fr}.options{grid-template-columns:1fr}.wrapper{padding:8px}.sheet{padding:16px}}
@media print{body{background:#fff}.wrapper{margin:0;padding:0}.sheet{box-shadow:none;border-radius:0}.actions,#result{display:none!important}.question{page-break-inside:avoid}}
</style>
</head>
<body>
<div class="wrapper"><main class="sheet">
<header>
  <h1>Mathematics Worksheet</h1>
  <div class="subtitle">Class 5 • Chapter 11</div>
  <span class="topic">Grandmother's Quilt – Area and Perimeter</span>
</header>
<div class="details">
  <label>Name<input id="studentName" type="text" placeholder="Enter student's name"></label>
  <label>Class / Section<input type="text" placeholder="__________"></label>
  <label>Date<input id="dateField" type="date"></label>
</div>
<div class="instructions"><strong>Instructions:</strong> Choose the one correct answer for each question. There are 25 questions. Each question carries 1 mark. Total marks: 25.</div>
<form id="quiz">
<div id="questions"></div>
<div class="actions">
  <button class="primary" type="submit">Submit Worksheet</button>
  <button class="secondary" type="button" onclick="window.print()">Print Worksheet</button>
  <button class="secondary" type="reset" id="resetBtn">Clear Answers</button>
</div>
</form>
<section id="result" aria-live="polite">
  <h2 id="scoreHeading"></h2>
  <p id="scoreText"></p>
  <div id="review" class="review"></div>
</section>
<footer>Based on Class 5 Mathematics, Chapter 11 – Grandmother's Quilt</footer>
</main></div>
<script>
const data = [
 {q:"What is the perimeter of a shape?",o:["The space inside a shape","The length of the border of a shape","The number of corners","The colour of the shape"],a:1,e:"Perimeter is the length of the border of a shape."},
 {q:"Which unit is suitable for measuring the perimeter of a notebook?",o:["Centimetre","Square centimetre","Litre","Kilogram"],a:0,e:"Perimeter measures length, so centimetres are suitable."},
 {q:"A square has a side of 4 cm. What is its perimeter?",o:["8 cm","12 cm","16 cm","20 cm"],a:2,e:"Perimeter of a square = 4 × side = 4 × 4 = 16 cm."},
 {q:"A square has a side of 5 cm. What is its perimeter?",o:["10 cm","15 cm","20 cm","25 cm"],a:2,e:"4 × 5 = 20 cm."},
 {q:"What do we call the region covered by a flat shape?",o:["Perimeter","Area","Length","Breadth"],a:1,e:"The region covered by a shape is called its area."},
 {q:"Which of these shapes can cover a surface without gaps or overlaps when used as equal tiles?",o:["Circles","Squares","Only stars","Only ovals"],a:1,e:"Squares tile a surface without gaps or overlaps."},
 {q:"What happens when equal circles are placed side by side to cover a flat surface?",o:["They always cover it with no gaps","They leave gaps","They become squares","They have no area"],a:1,e:"Circles leave gaps when placed side by side."},
 {q:"A square with each side 1 unit long has an area of:",o:["1 unit","1 unit square","4 units","4 unit squares"],a:1,e:"A 1-unit by 1-unit square has an area of 1 unit square."},
 {q:"A rectangle has 6 rows of 4 square patches. How many patches are there?",o:["10","20","24","28"],a:2,e:"6 × 4 = 24 patches."},
 {q:"What is the formula for the area of a rectangle?",o:["Length + Breadth","2 × Length + 2 × Breadth","Length × Breadth","4 × Length"],a:2,e:"Area of a rectangle = Length × Breadth."},
 {q:"A rectangle is 8 cm long and 3 cm broad. What is its area?",o:["11 sq cm","22 sq cm","24 sq cm","30 sq cm"],a:2,e:"8 × 3 = 24 square centimetres."},
 {q:"A rectangle is 7 cm long and 5 cm broad. What is its area?",o:["12 sq cm","24 sq cm","35 sq cm","70 sq cm"],a:2,e:"7 × 5 = 35 square centimetres."},
 {q:"What is the formula for the perimeter of a rectangle?",o:["Length × Breadth","2 × Length + 2 × Breadth","Length × Length","Length + Breadth"],a:1,e:"Perimeter = Length + Length + Breadth + Breadth."},
 {q:"A rectangle is 6 cm long and 4 cm broad. What is its perimeter?",o:["10 cm","20 cm","24 cm","28 cm"],a:1,e:"6 + 6 + 4 + 4 = 20 cm."},
 {q:"A square has a side of 5 cm. What is its area?",o:["10 sq cm","20 sq cm","25 sq cm","30 sq cm"],a:2,e:"Area of a square = side × side = 5 × 5 = 25 square cm."},
 {q:"A square has a side of 6 cm. What is its area?",o:["12 sq cm","24 sq cm","30 sq cm","36 sq cm"],a:3,e:"6 × 6 = 36 square centimetres."},
 {q:"A square has a side of 5 cm. What is its perimeter?",o:["15 cm","20 cm","25 cm","30 cm"],a:1,e:"4 × 5 = 20 cm."},
 {q:"A rectangular field is 42 m long and 34 m broad. What is its area?",o:["76 sq m","1,428 sq m","1,528 sq m","1,600 sq m"],a:1,e:"42 × 34 = 1,428 square metres."},
 {q:"A rectangular garden has an area of 64 sq m and a length of 16 m. What is its breadth?",o:["2 m","4 m","8 m","16 m"],a:1,e:"Breadth = Area ÷ Length = 64 ÷ 16 = 4 m."},
 {q:"In a rectangle, the opposite sides are:",o:["Always unequal","Equal in length","Always curved","All different"],a:1,e:"The opposite sides of a rectangle are equal."},
 {q:"Which measurement tells us how much surface a mat covers?",o:["Area","Perimeter","Height only","Weight"],a:0,e:"Area tells us how much surface a mat covers."},
 {q:"If a shape is covered completely with 18 equal square patches, its area is:",o:["18 square units","18 cm perimeter","9 units","36 square units"],a:0,e:"Each equal square patch represents one square unit of area."},
 {q:"Can two shapes have the same area but different perimeters?",o:["No, never","Yes","Only if both are circles","Only if both are squares"],a:1,e:"Different shapes can cover equal areas but have different boundary lengths."},
 {q:"If the length and breadth of a rectangle are both 4 cm, what shape is it?",o:["Triangle","Circle","Square","Oval"],a:2,e:"A rectangle with all four sides equal is a square."},
 {q:"Which statement is correct?",o:["Area is measured in centimetres only","Perimeter is measured in square units","Area is measured in square units","Area and perimeter mean the same thing"],a:2,e:"Area is measured in square units; perimeter is measured in length units."}
];
const host=document.getElementById('questions');
data.forEach((item,i)=>{
 const section=document.createElement('section'); section.className='question'; section.id='q'+i;
 const h=document.createElement('h3'); h.textContent=(i+1)+'. '+item.q; section.appendChild(h);
 const opts=document.createElement('div'); opts.className='options';
 item.o.forEach((opt,j)=>{
   const lab=document.createElement('label'); lab.className='option';
   const radio=document.createElement('input'); radio.type='radio'; radio.name='q'+i; radio.value=j;
   const span=document.createElement('span'); span.textContent=String.fromCharCode(65+j)+'. '+opt;
   lab.append(radio,span); opts.appendChild(lab);
 });
 section.appendChild(opts); host.appendChild(section);
});
document.getElementById('dateField').value=new Date().toISOString().slice(0,10);
document.getElementById('quiz').addEventListener('submit',function(ev){
 ev.preventDefault(); let score=0,answered=0; const review=document.getElementById('review'); review.innerHTML='';
 data.forEach((item,i)=>{
  const selected=document.querySelector('input[name="q'+i+'"]:checked');
  const good=selected && Number(selected.value)===item.a;
  if(selected) answered++; if(good) score++;
  const div=document.createElement('div'); div.className='review-item '+(good?'correct':'incorrect');
  const title=document.createElement('strong');
  title.textContent=(i+1)+'. '+(good?'Correct':selected?'Incorrect':'Not answered');
  const detail=document.createElement('div');
  detail.textContent='Correct answer: '+String.fromCharCode(65+item.a)+'. '+item.o[item.a]+'. '+item.e;
  div.append(title,detail); review.appendChild(div);
 });
 const name=document.getElementById('studentName').value.trim();
 document.getElementById('scoreHeading').textContent=(name?name+', ':'')+'Your score: '+score+' / 25';
 document.getElementById('scoreText').textContent='You answered '+answered+' out of 25 questions. '+(score>=22?'Excellent work!':score>=17?'Good effort! Review the explanations below.':'Keep practising. Read the explanations and try again.');
 document.getElementById('result').style.display='block';
 document.getElementById('result').scrollIntoView({behavior:'smooth'});
});
document.getElementById('resetBtn').addEventListener('click',()=>{
 document.getElementById('result').style.display='none';
 document.getElementById('review').innerHTML='';
});
</script>
</body>
</html>
